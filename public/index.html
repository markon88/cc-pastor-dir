<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a5276">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CC Pastors">
  <meta name="description" content="Carolina Conference SDA Pastor Directory">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <title>CC Pastors</title>
</head>
<body>
  <!-- Login screen — shown before auth check completes, hidden once authenticated -->
  <div id="login-screen">
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="CC Pastors" class="login-logo">
      <h1 class="login-title">CC Pastors</h1>
      <p class="login-subtitle">Carolina Conference Pastor Directory</p>
      <a href="/api/auth/google" class="google-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </a>
      <p id="login-error-msg" class="login-error hidden"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="banners"></div>
    <div id="main-content"></div>

    <nav id="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="pastors" role="tab" aria-label="Pastors">
        <span class="tab-icon">👤</span>
        <span>Pastors</span>
      </button>
      <button class="tab-btn" data-tab="churches" role="tab" aria-label="Churches">
        <span class="tab-icon">⛪</span>
        <span>Churches</span>
      </button>
      <button class="tab-btn" data-tab="groups" role="tab" aria-label="AMA Groups">
        <span class="tab-icon">👥</span>
        <span>Groups</span>
      </button>
      <button class="tab-btn" data-tab="support" role="tab" aria-label="Support">
        <span class="tab-icon">ℹ️</span>
        <span>Support</span>
      </button>
      <button class="tab-btn" data-tab="admin" role="tab" aria-label="Admin" style="display:none">
        <span class="tab-icon">🔑</span>
        <span>Admin</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
